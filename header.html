<style>

/* =========================
UNIVERSAL HEADER
========================= */

.site-header{

position:fixed;

top:0;
left:0;

width:100%;

z-index:5000;

padding:22px 6%;

display:flex;

align-items:center;

justify-content:space-between;

background:
rgba(6,5,4,0.78);

backdrop-filter:blur(16px);

-webkit-backdrop-filter:blur(16px);

border-bottom:
1px solid rgba(255,255,255,0.04);

transition:0.4s ease;

}

.site-logo{

font-family:'Cinzel',serif;

font-size:1rem;

letter-spacing:3px;

color:#f0cf8d;

text-decoration:none;

white-space:nowrap;

z-index:6000;

}

/* =========================
DESKTOP NAV
========================= */

.desktop-nav{

display:flex;

align-items:center;

gap:20px;

flex-wrap:wrap;

}

.desktop-nav a{

position:relative;

text-decoration:none;

font-size:11px;

letter-spacing:3px;

text-transform:uppercase;

color:#d5c2a5;

transition:0.4s ease;

}

.desktop-nav a::after{

content:"";

position:absolute;

left:0;
bottom:-6px;

width:0%;

height:1px;

background:#d4a44f;

transition:0.4s ease;

}

.desktop-nav a:hover{

color:#f6ddb0;

}

.desktop-nav a:hover::after{

width:100%;

}

.desktop-nav a.active{

color:#f6ddb0;

}

.desktop-nav a.active::after{

width:100%;

}

/* =========================
MENU BUTTON
========================= */

.menu-toggle{

width:58px;
height:58px;

display:none;

align-items:center;

justify-content:center;

cursor:pointer;

background:
rgba(212,164,79,0.05);

border:
1px solid rgba(212,164,79,0.18);

border-radius:50%;

transition:0.4s ease;

z-index:7000;

}

.menu-toggle:hover{

border-color:
rgba(212,164,79,0.4);

box-shadow:
0 0 25px rgba(212,164,79,0.12);

}

.arrow-wrap{

position:relative;

width:22px;
height:22px;

transform:
rotate(0deg);

transition:0.4s ease;

}

.arrow-line{

position:absolute;

top:50%;
left:0;

width:100%;
height:1px;

background:#f0cf8d;

transition:0.4s ease;

}

.arrow-line::before,
.arrow-line::after{

content:"";

position:absolute;

right:0;

width:8px;
height:1px;

background:#f0cf8d;

transition:0.4s ease;

}

.arrow-line::before{

top:-3px;

transform:
rotate(45deg);

}

.arrow-line::after{

top:3px;

transform:
rotate(-45deg);

}

.menu-open .arrow-wrap{

transform:
rotate(180deg);

}

/* =========================
SLIDE MENU
========================= */

.mobile-menu{

position:fixed;

top:0;
right:-100%;

width:340px;

max-width:90vw;

height:100vh;

background:
linear-gradient(
180deg,
#0f0c0a,
#060504
);

padding:140px 40px 60px;

display:flex;

flex-direction:column;

gap:28px;

transition:0.5s ease;

z-index:6500;

border-left:
1px solid rgba(212,164,79,0.12);

box-shadow:
-10px 0 40px rgba(0,0,0,0.45);

overflow-y:auto;

}

.mobile-menu.active{

right:0;

}

.mobile-menu a{

text-decoration:none;

font-family:'Cinzel',serif;

font-size:1rem;

letter-spacing:2px;

color:#d8c4a5;

transition:0.4s ease;

position:relative;

width:fit-content;

}

.mobile-menu a::after{

content:"";

position:absolute;

left:0;
bottom:-8px;

width:0%;

height:1px;

background:#d4a44f;

transition:0.4s ease;

}

.mobile-menu a:hover{

color:#f6ddb0;

transform:translateX(6px);

}

.mobile-menu a:hover::after{

width:100%;

}

.mobile-menu a.active{

color:#f6ddb0;

}

.mobile-menu a.active::after{

width:100%;

}

/* =========================
OVERLAY
========================= */

.menu-overlay{

position:fixed;

inset:0;

background:
rgba(0,0,0,0.55);

backdrop-filter:blur(3px);

-webkit-backdrop-filter:blur(3px);

opacity:0;

pointer-events:none;

transition:0.4s ease;

z-index:6400;

}

.menu-overlay.active{

opacity:1;

pointer-events:auto;

}

/* =========================
RESPONSIVE
========================= */

@media(max-width:980px){

.desktop-nav{

display:none;

}

.menu-toggle{

display:flex;

}

}

</style>

<header class="site-header">

<a href="index.html" class="site-logo">

A LOVE OLDER THAN FEAR

</a>

<nav class="desktop-nav">

<a href="index.html" data-page="home">
Home
</a>

<a href="reading-paths.html" data-page="reading-paths">
Reading Paths
</a>

<a href="chapters.html" data-page="chapters">
Chapters
</a>

<a href="resources.html" data-page="resources">
Resources
</a>

<a href="study-guide.html" data-page="study-guide">
Study Guide
</a>

<a href="prayer-room.html" data-page="prayer-room">
Prayer Room
</a>

<a href="about.html" data-page="about">
About
</a>

<a href="covenant.html" data-page="covenant">
Covenant
</a>

</nav>

<div class="menu-toggle">

<div class="arrow-wrap">

<div class="arrow-line"></div>

</div>

</div>

</header>

<div class="menu-overlay"></div>

<nav class="mobile-menu">

<a href="index.html" data-page="home">
Home
</a>

<a href="reading-paths.html" data-page="reading-paths">
Reading Paths
</a>

<a href="chapters.html" data-page="chapters">
Chapters
</a>

<a href="resources.html" data-page="resources">
Resources
</a>

<a href="study-guide.html" data-page="study-guide">
Study Guide
</a>

<a href="prayer-room.html" data-page="prayer-room">
Prayer Room

<a href="about.html" data-page="about">

</a>

<a href="covenant.html" data-page="covenant">

</nav>

<script>

function initializeHeader(){

const toggle =
document.querySelector(
'.menu-toggle'
);

const menu =
document.querySelector(
'.mobile-menu'
);

const overlay =
document.querySelector(
'.menu-overlay'
);

toggle.addEventListener(
'click',
() => {

menu.classList.toggle(
'active'
);

overlay.classList.toggle(
'active'
);

toggle.classList.toggle(
'menu-open'
);

document.body.style.overflow =
menu.classList.contains('active')
? 'hidden'
: '';

});

overlay.addEventListener(
'click',
closeMenu
);

function closeMenu(){

menu.classList.remove(
'active'
);

overlay.classList.remove(
'active'
);

toggle.classList.remove(
'menu-open'
);

document.body.style.overflow =
'';

}

const currentPage =
document.body.dataset.page;

document.querySelectorAll(
'[data-page]'
).forEach(link => {

if(
link.dataset.page === currentPage
){

link.classList.add(
'active'
);

}

});

}

</script>
