<style>

/* =========================
HEADER
========================= */

.site-header{

position:fixed;

top:0;
left:0;

width:100%;

z-index:9999;

padding:22px 5%;

display:flex;

align-items:center;

justify-content:space-between;

background:
rgba(7,6,5,0.72);

backdrop-filter:blur(14px);

-webkit-backdrop-filter:blur(14px);

border-bottom:
1px solid rgba(255,255,255,0.04);

transition:0.45s ease;

}

.site-logo{

font-family:'Cinzel',serif;

font-size:0.95rem;

letter-spacing:3px;

color:#f0cf8d;

text-decoration:none;

white-space:nowrap;

z-index:10001;

}

.desktop-nav{

display:flex;

align-items:center;

gap:20px;

flex-wrap:wrap;

}

.desktop-nav a{

position:relative;

font-size:10px;

letter-spacing:2px;

text-transform:uppercase;

text-decoration:none;

color:#d7c3a4;

transition:0.4s ease;

}

.desktop-nav a::after{

content:"";

position:absolute;

left:0;
bottom:-7px;

width:0%;

height:1px;

background:#d4a44f;

transition:0.4s ease;

}

.desktop-nav a:hover,
.desktop-nav a.active{

color:#f2d18b;

}

.desktop-nav a:hover::after,
.desktop-nav a.active::after{

width:100%;

}

/* =========================
MENU BUTTON
========================= */

.menu-toggle{

display:none;

width:56px;
height:56px;

border-radius:50%;

border:
1px solid rgba(212,164,79,0.3);

background:
rgba(212,164,79,0.06);

align-items:center;

justify-content:center;

cursor:pointer;

z-index:10001;

transition:0.4s ease;

}

.menu-toggle:hover{

background:
rgba(212,164,79,0.14);

}

.arrow{

font-size:1.3rem;

color:#f0cf8d;

transition:0.4s ease;

}

.menu-toggle.active .arrow{

transform:rotate(180deg);

}

/* =========================
OVERLAY
========================= */

.menu-overlay{

position:fixed;

inset:0;

background:
rgba(0,0,0,0.55);

backdrop-filter:blur(8px);

opacity:0;

visibility:hidden;

transition:0.45s ease;

z-index:9997;

}

.menu-overlay.active{

opacity:1;

visibility:visible;

}

/* =========================
SLIDE MENU
========================= */

.slide-menu{

position:fixed;

top:0;
right:0;

width:340px;
max-width:90%;

height:100dvh;

background:
linear-gradient(
180deg,
rgba(10,8,7,0.98),
rgba(20,15,13,0.98)
);

padding:120px 40px;

overflow-y:auto;

transform:translateX(110%);

transition:0.5s ease;

z-index:9998;

}

.slide-menu.active{

transform:translateX(0);

}

.slide-links{

display:flex;

flex-direction:column;

gap:24px;

}

.slide-links a{

font-family:'Cinzel',serif;

font-size:1.3rem;

text-decoration:none;

color:#f3e7d4;

display:flex;

justify-content:space-between;

padding-bottom:16px;

border-bottom:
1px solid rgba(255,255,255,0.06);

}

/* =========================
RESPONSIVE
========================= */

@media(max-width:900px){

.desktop-nav{
display:none;
}

.menu-toggle{
display:flex;
}

}

@media(min-width:901px){

.slide-menu,
.menu-overlay{
display:none;
}

}

</style>

<header class="site-header">

<a href="index.html" class="site-logo">

A LOVE OLDER THAN FEAR

</a>

<nav class="desktop-nav">

<a href="index.html" class="nav-link">Home</a>
<a href="archive.html" class="nav-link">Archive</a>
<a href="chapters.html" class="nav-link">Chapters</a>

<a href="resources.html" class="nav-link">Resources</a>

<a href="notes.html" class="nav-link">Notes</a>

</nav>

<div class="menu-toggle" id="menuToggle">

<div class="arrow">

</div>

</div>

</header>

<div class="menu-overlay" id="menuOverlay"></div>

<div class="slide-menu" id="slideMenu">

<script>

const menuToggle =
document.getElementById(
'menuToggle'
);

const slideMenu =
document.getElementById(
'slideMenu'
);

const menuOverlay =
document.getElementById(
'menuOverlay'
);

function toggleMenu(){

menuToggle.classList.toggle(
'active'
);

slideMenu.classList.toggle(
'active'
);

menuOverlay.classList.toggle(
'active'
);

}

menuToggle.addEventListener(
'click',
toggleMenu
);

menuOverlay.addEventListener(
'click',
toggleMenu
);

document.querySelectorAll(
'.slide-links a'
).forEach(link => {

link.addEventListener(
'click',
() => {

menuToggle.classList.remove(
'active'
);

slideMenu.classList.remove(
'active'
);

menuOverlay.classList.remove(
'active'
);

});

});

const currentPage =
window.location.pathname
.split("/")
.pop();

document.querySelectorAll(
'.nav-link'
).forEach(link => {

if(
link.getAttribute('href')
=== currentPage
){

link.classList.add(
'active'
);

}

});

</script>
