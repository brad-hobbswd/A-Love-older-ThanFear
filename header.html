<style>

/* =========================
HEADER
========================= */

.site-header{

position:fixed;

top:0;
left:0;

width:100%;

z-index:9999;

padding:22px 5%;

display:flex;

align-items:center;

justify-content:space-between;

background:
rgba(7,6,5,0.72);

backdrop-filter:blur(14px);

-webkit-backdrop-filter:blur(14px);

border-bottom:
1px solid rgba(255,255,255,0.04);

}

/* =========================
LOGO
========================= */

.site-logo{

font-family:'Cinzel',serif;

font-size:0.95rem;

letter-spacing:3px;

color:#f0cf8d;

text-decoration:none;

white-space:nowrap;

z-index:10001;

}

/* =========================
DESKTOP NAV
========================= */

.desktop-nav{

display:flex;

align-items:center;

gap:20px;

}

.desktop-nav a{

position:relative;

font-size:10px;

letter-spacing:2px;

text-transform:uppercase;

text-decoration:none;

color:#d7c3a4;

transition:0.4s ease;

}

.desktop-nav a::after{

content:"";

position:absolute;

left:0;
bottom:-7px;

width:0%;

height:1px;

background:#d4a44f;

transition:0.4s ease;

}

.desktop-nav a:hover{

color:#f2d18b;

}

.desktop-nav a:hover::after{

width:100%;

}

.desktop-nav a.active{

color:#f2d18b;

}

.desktop-nav a.active::after{

width:100%;

}

/* =========================
MENU BUTTON
========================= */

.menu-toggle{

width:58px;
height:58px;

border-radius:50%;

border:
1px solid rgba(212,164,79,0.28);

background:
rgba(212,164,79,0.06);

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

transition:0.45s ease;

position:relative;

overflow:hidden;

z-index:10001;

}

.menu-toggle:hover{

transform:translateY(-2px);

border-color:
rgba(212,164,79,0.5);

box-shadow:
0 0 30px rgba(212,164,79,0.15);

}

/* =========================
GOLD ARROW
========================= */

.arrow-wrap{

position:relative;

width:24px;
height:24px;

display:flex;

align-items:center;

justify-content:center;

}

.arrow-line{

position:absolute;

width:16px;
height:1px;

background:#f0cf8d;

transition:0.45s ease;

}

.arrow-line.one{

transform:
rotate(45deg)
translate(2px,-5px);

}

.arrow-line.two{

transform:
rotate(-45deg)
translate(2px,5px);

}

.menu-toggle.active
.arrow-line.one{

transform:
rotate(-45deg)
translate(2px,-5px);

}

.menu-toggle.active
.arrow-line.two{

transform:
rotate(45deg)
translate(2px,5px);

}

/* =========================
OVERLAY
========================= */

.menu-overlay{

position:fixed;

inset:0;

background:
rgba(0,0,0,0.55);

backdrop-filter:blur(8px);

-webkit-backdrop-filter:blur(8px);

opacity:0;

visibility:hidden;

transition:0.45s ease;

z-index:9997;

}

.menu-overlay.active{

opacity:1;

visibility:visible;

}

/* =========================
SLIDE MENU
========================= */

.slide-menu{

position:fixed;

top:0;
right:0;

width:min(420px,90vw);

height:100vh;

padding:130px 50px 60px;

background:
linear-gradient(
180deg,
#0d0b0a,
#17120f
);

border-left:
1px solid rgba(212,164,79,0.14);

transform:translateX(100%);

transition:0.55s cubic-bezier(.77,0,.18,1);

overflow-y:auto;

z-index:9998;

}

.slide-menu.active{

transform:translateX(0);

}

/* =========================
MENU LABEL
========================= */

.menu-label{

font-size:11px;

letter-spacing:5px;

text-transform:uppercase;

color:#d4a44f;

margin-bottom:45px;

}

/* =========================
MENU LINKS
========================= */

.slide-links{

display:flex;

flex-direction:column;

gap:26px;

}

.slide-links a{

font-family:'Cinzel',serif;

font-size:1.5rem;

line-height:1.4;

text-decoration:none;

color:#f3e7d4;

display:flex;

align-items:center;

justify-content:space-between;

padding-bottom:18px;

border-bottom:
1px solid rgba(255,255,255,0.05);

transition:0.4s ease;

}

.slide-links a span{

font-size:1.2rem;

color:#d4a44f;

transform:translateX(0);

transition:0.4s ease;

}

.slide-links a:hover{

color:#f0cf8d;

padding-left:8px;

}

.slide-links a:hover span{

transform:translateX(10px);

}

/* =========================
MOBILE
========================= */

@media(max-width:900px){

.desktop-nav{

display:none;

}

}

@media(min-width:901px){

.menu-toggle{

display:flex;

}

}

@media(max-width:540px){

.site-header{

padding:18px 20px;

}

.site-logo{

font-size:0.74rem;

letter-spacing:1.5px;

}

.slide-menu{

padding:
120px 34px 50px;

}

.slide-links a{

font-size:1.2rem;

}

.menu-toggle{

width:52px;
height:52px;

}

}

</style>

<script>

/* =========================
ELEMENTS
========================= */

const menuToggle =
document.getElementById(
'menuToggle'
);

const slideMenu =
document.getElementById(
'slideMenu'
);

const menuOverlay =
document.getElementById(
'menuOverlay'
);

/* =========================
TOGGLE MENU
========================= */

function toggleMenu(){

menuToggle.classList.toggle(
'active'
);

slideMenu.classList.toggle(
'active'
);

menuOverlay.classList.toggle(
'active'
);

}

/* =========================
OPEN/CLOSE
========================= */

menuToggle.addEventListener(
'click',
toggleMenu
);

menuOverlay.addEventListener(
'click',
toggleMenu
);

/* =========================
CLOSE ON LINK CLICK
========================= */

document.querySelectorAll(
'.slide-links a'
).forEach(link => {

link.addEventListener(
'click',
() => {

menuToggle.classList.remove(
'active'
);

slideMenu.classList.remove(
'active'
);

menuOverlay.classList.remove(
'active'
);

});

});

/* =========================
ACTIVE LINK
========================= */

const currentPage =
window.location.pathname
.split("/")
.pop();

document.querySelectorAll(
'.nav-link'
).forEach(link => {

if(
link.getAttribute('href')
=== currentPage
){

link.classList.add(
'active'
);

}

});

</script>
