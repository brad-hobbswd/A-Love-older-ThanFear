<style>
/* Shared site navigation for desktop, tablet, and mobile */
.site-header,
.site-header * { box-sizing: border-box; }

.site-header {
  position: fixed;
  inset: 0 0 auto;
  width: 100%;
  z-index: 9999;
  min-height: 76px;
  padding: 14px clamp(18px, 4vw, 64px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
  background: rgba(7, 6, 5, .90);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(212,164,79,.22);
  box-shadow: 0 8px 28px rgba(0,0,0,.16);
}
.site-logo {
  flex: 0 1 auto;
  min-width: 0;
  max-width: 360px;
  font-family: 'Cinzel', serif;
  font-size: clamp(.72rem, .9vw, .95rem);
  line-height: 1.45;
  letter-spacing: clamp(1.2px, .18vw, 2.6px);
  color: #f0cf8d;
  text-decoration: none;
  white-space: normal;
}
.desktop-nav {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: clamp(10px, 1.25vw, 20px);
  flex: 1 1 auto;
}
.desktop-nav a {
  position: relative;
  padding: 10px 0;
  font-size: clamp(9px, .65vw, 11px);
  letter-spacing: clamp(.6px, .08vw, 1.3px);
  line-height: 1.3;
  white-space: nowrap;
  text-transform: uppercase;
  text-decoration: none;
  color: #d7c3a4;
  transition: color .2s ease;
}
.desktop-nav a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 3px;
  width: 0;
  height: 1px;
  background: #d4a44f;
  transition: width .2s ease;
}
.desktop-nav a:hover,
.desktop-nav a.active { color: #f2d18b; }
.desktop-nav a:hover::after,
.desktop-nav a.active::after { width: 100%; }

.menu-toggle {
  display: none;
  flex: 0 0 46px;
  width: 46px;
  height: 46px;
  padding: 0;
  border: 1px solid rgba(212,164,79,.45);
  border-radius: 50%;
  background: rgba(212,164,79,.08);
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: #f2d18b;
  transition: background .2s ease, border-color .2s ease;
}
.menu-toggle:hover,
.menu-toggle:focus-visible {
  background: rgba(212,164,79,.18);
  border-color: rgba(242,209,139,.85);
  outline: 2px solid rgba(242,209,139,.55);
  outline-offset: 3px;
}
.menu-icon { display:flex; flex-direction:column; gap:5px; width:18px; }
.menu-icon span {
  display:block; height:2px; width:100%; border-radius:2px;
  background:#f2d18b; transition:transform .2s ease, opacity .2s ease;
}
.menu-toggle.active .menu-icon span:first-child { transform:translateY(7px) rotate(45deg); }
.menu-toggle.active .menu-icon span:nth-child(2) { opacity:0; }
.menu-toggle.active .menu-icon span:last-child { transform:translateY(-7px) rotate(-45deg); }

.menu-overlay {
  position:fixed; inset:0; z-index:9997;
  background:rgba(0,0,0,.62);
  -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
  opacity:0; visibility:hidden; transition:opacity .25s ease,visibility .25s ease;
}
.menu-overlay.active { opacity:1; visibility:visible; }
.slide-menu {
  position:fixed; top:0; right:0; z-index:9998;
  width:min(390px, 88vw); height:100vh; height:100dvh;
  padding:calc(88px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));
  overflow-y:auto; overscroll-behavior:contain;
  background:linear-gradient(180deg,rgba(10,8,7,.99),rgba(20,15,13,.99));
  border-left:1px solid rgba(212,164,79,.25);
  box-shadow:-18px 0 48px rgba(0,0,0,.3);
  transform:translateX(105%); visibility:hidden;
  transition:transform .28s ease,visibility .28s ease;
}
.slide-menu.active { transform:translateX(0); visibility:visible; }
.slide-links { display:flex; flex-direction:column; gap:0; }
.slide-links a {
  display:flex; align-items:center; justify-content:space-between; gap:18px;
  min-height:54px; padding:15px 2px;
  border-bottom:1px solid rgba(255,255,255,.09);
  font-family:'Cinzel',serif; font-size:1rem; line-height:1.4;
  text-decoration:none; color:#f3e7d4;
  transition:color .2s ease,padding .2s ease;
}
.slide-links a:hover,
.slide-links a:focus-visible { color:#f2d18b; padding-left:6px; outline:none; }
.slide-links a span { color:#d4a44f; }
body.nav-open { overflow:hidden; }

@media (max-width: 1100px) {
  .site-header { min-height:68px; padding:10px max(18px, 4vw); gap:14px; }
  .site-logo { max-width:calc(100% - 64px); font-size:clamp(.66rem, 2.1vw, .88rem); letter-spacing:clamp(1px, .25vw, 2px); }
  .desktop-nav { display:none; }
  .menu-toggle { display:flex; }
}
@media (max-width: 480px) {
  .site-header {
    min-height:64px;
    padding:9px max(14px, 4vw);
    gap:10px;
  }
  .site-logo {
    max-width:calc(100% - 54px);
    font-size:clamp(.61rem, 3vw, .76rem);
    letter-spacing:1.1px;
    line-height:1.35;
  }
  .menu-toggle { width:42px; height:42px; flex-basis:42px; }
  .slide-menu { padding-left:22px; padding-right:22px; }
  .slide-links a { min-height:50px; font-size:.96rem; }
}
@media (prefers-reduced-motion: reduce) {
  .site-header *, .menu-overlay, .slide-menu { transition:none !important; }
}
</style>

<script>
(() => {
  const toggle = document.getElementById('menuToggle');
  const menu = document.getElementById('slideMenu');
  const overlay = document.getElementById('menuOverlay');
  if (!toggle || !menu || !overlay) return;

  const setOpen = (open) => {
    toggle.classList.toggle('active', open);
    menu.classList.toggle('active', open);
    overlay.classList.toggle('active', open);
    document.body.classList.toggle('nav-open', open);
    toggle.setAttribute('aria-expanded', String(open));
    toggle.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
  };
  toggle.addEventListener('click', () => setOpen(toggle.getAttribute('aria-expanded') !== 'true'));
  overlay.addEventListener('click', () => setOpen(false));
  menu.querySelectorAll('a').forEach(link => link.addEventListener('click', () => setOpen(false)));
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') setOpen(false);
  });

  const currentPage = window.location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('.nav-link').forEach(link => {
    if (link.getAttribute('href') === currentPage) link.classList.add('active');
  });
  menu.querySelectorAll('a').forEach(link => {
    if (link.getAttribute('href') === currentPage) {
      link.setAttribute('aria-current', 'page');
      link.style.color = '#f2d18b';
    }
  });
})();
</script>
