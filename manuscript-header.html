<style>

/* =========================
MANUSCRIPT HEADER
========================= */

.manuscript-header{

position:fixed;

top:0;
left:0;

width:100%;

z-index:9999;

padding:24px 5%;

display:flex;

align-items:center;

justify-content:space-between;

background:
rgba(7,6,5,0.72);

backdrop-filter:blur(16px);

-webkit-backdrop-filter:blur(16px);

border-bottom:
1px solid rgba(255,255,255,0.04);

transition:0.45s ease;

}

/* =========================
SIDE LINKS
========================= */

.manuscript-side{

display:flex;

align-items:center;

gap:14px;

min-width:180px;

}

.manuscript-side.right{

justify-content:flex-end;

}

.manuscript-side a{

display:inline-flex;

align-items:center;

gap:12px;

text-decoration:none;

font-size:11px;

letter-spacing:4px;

text-transform:uppercase;

color:#d7c3a4;

transition:0.4s ease;

}

.manuscript-side a:hover{

color:#f0cf8d;

transform:translateX(3px);

}

/* =========================
CENTER TITLE
========================= */

.manuscript-center{

text-align:center;

flex:1;

padding:0 20px;

}

.manuscript-title{

font-family:'Cinzel',serif;

font-size:0.95rem;

letter-spacing:3px;

color:#f0cf8d;

text-decoration:none;

display:block;

margin-bottom:8px;

}

.manuscript-subtitle{

font-size:10px;

letter-spacing:4px;

text-transform:uppercase;

color:#9f907d;

}

/* =========================
ARROWS
========================= */

.manuscript-arrow{

font-size:1rem;

transition:0.4s ease;

}

.manuscript-side a:hover
.manuscript-arrow{

transform:translateX(5px);

}

/* =========================
SCROLL EFFECT
========================= */

.manuscript-header.scrolled{

background:
rgba(7,6,5,0.92);

border-bottom:
1px solid rgba(255,255,255,0.06);

}

/* =========================
MOBILE
========================= */

@media(max-width:768px){

.manuscript-header{

padding:20px 20px;

gap:14px;

}

.manuscript-side{

min-width:auto;

}

.manuscript-side a{

font-size:9px;

letter-spacing:2px;

}

.manuscript-title{

font-size:0.75rem;

letter-spacing:2px;

line-height:1.4;

}

.manuscript-subtitle{

font-size:8px;

letter-spacing:2px;

}

}

@media(max-width:540px){

.manuscript-header{

flex-direction:column;

padding:18px 18px;

}

.manuscript-center{

order:-1;

padding:0;

}

.manuscript-side{

width:100%;

justify-content:space-between;

}

}

</style>

<header class="manuscript-header" id="manuscriptHeader">

<div class="manuscript-side">

<a href="part1.html">

<span class="manuscript-arrow">
←
</span>

Previous

</a>

</div>

<div class="manuscript-center">

<a
href="chapters.html"
class="manuscript-title">

A LOVE OLDER THAN FEAR

</a>

<div class="manuscript-subtitle">

MANUSCRIPT ARCHIVE

</div>

</div>

<div class="manuscript-side right">

<a href="part3.html">

Next

<span class="manuscript-arrow">
→
</span>

</a>

</div>

</header>

<script>

/* =========================
HEADER SCROLL EFFECT
========================= */

const manuscriptHeader =
document.getElementById(
'manuscriptHeader'
);

window.addEventListener(
'scroll',
() => {

if(window.scrollY > 50){

manuscriptHeader.classList.add(
'scrolled'
);

}

else{

manuscriptHeader.classList.remove(
'scrolled'
);

}

});

</script>
