<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Page Not Found | A Love Older Than Fear
</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
rel="stylesheet">

<style>

/* =========================
RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

:root{

--bg-main:#090807;
--bg-alt:#120f0d;

--gold:#d4a44f;
--gold-soft:#f2d18b;

--text:#f8f2e8;
--muted:#c8bbab;

}

body{

background:var(--bg-main);

font-family:'Inter',sans-serif;

color:var(--text);

overflow-x:hidden;

position:relative;

}

/* =========================
SCROLLBAR
========================= */

::-webkit-scrollbar{
width:10px;
}

::-webkit-scrollbar-track{
background:#090807;
}

::-webkit-scrollbar-thumb{
background:var(--gold);
border-radius:20px;
}

/* =========================
ATMOSPHERE
========================= */

.atmosphere{

position:fixed;

inset:0;

pointer-events:none;

z-index:1;

overflow:hidden;

}

.particle{

position:absolute;

width:3px;
height:3px;

background:rgba(255,215,150,0.18);

border-radius:50%;

animation:float 20s linear infinite;

}

.particle:nth-child(1){
top:10%;
left:15%;
animation-duration:24s;
}

.particle:nth-child(2){
top:70%;
left:80%;
animation-duration:18s;
}

.particle:nth-child(3){
top:40%;
left:55%;
animation-duration:28s;
}

.particle:nth-child(4){
top:80%;
left:30%;
animation-duration:22s;
}

.particle:nth-child(5){
top:20%;
left:90%;
animation-duration:26s;
}

@keyframes float{

0%{
transform:translateY(0);
opacity:0;
}

20%{
opacity:1;
}

80%{
opacity:1;
}

100%{
transform:translateY(-150px);
opacity:0;
}

}

/* =========================
MAIN HERO
========================= */

.error-hero{

position:relative;

min-height:100vh;

display:flex;

align-items:center;
justify-content:center;

padding:220px 8% 140px;

overflow:hidden;

background:
linear-gradient(
180deg,
#090807 0%,
#120f0d 50%,
#090807 100%
);

}

.error-hero::before{

content:"";

position:absolute;

inset:0;

background:

radial-gradient(
circle at top center,
rgba(212,164,79,0.08),
transparent 45%
),

radial-gradient(
circle at bottom center,
rgba(255,255,255,0.03),
transparent 60%
);

pointer-events:none;

}

.hero-overlay{

position:absolute;

inset:0;

background:
linear-gradient(
180deg,
rgba(0,0,0,0.62) 0%,
rgba(0,0,0,0.12) 40%,
rgba(0,0,0,0.82) 100%
);

z-index:2;

}

.error-content{

position:relative;

z-index:5;

max-width:1000px;

margin:auto;

text-align:center;

animation:fadeUp 1.4s ease;

}

@keyframes fadeUp{

0%{
opacity:0;
transform:translateY(30px);
}

100%{
opacity:1;
transform:translateY(0);
}

}

.page-code{

font-family:'Cinzel',serif;

font-size:clamp(7rem,16vw,14rem);

letter-spacing:8px;

color:#d4a44f;

margin-bottom:20px;

text-shadow:
0 0 30px rgba(212,164,79,0.18);

}

.page-title{

font-family:'Cinzel',serif;

font-size:clamp(2.5rem,6vw,5rem);

line-height:1.15;

margin-bottom:35px;

color:#f4e7d2;

}

.page-text{

font-size:1.2rem;

line-height:2;

max-width:780px;

margin:auto auto 60px;

color:#c8bbab;

font-weight:300;

}

/* =========================
BUTTONS
========================= */

.button-group{

display:flex;

align-items:center;
justify-content:center;

gap:24px;

flex-wrap:wrap;

}

.home-button{

display:inline-flex;

align-items:center;
justify-content:center;

gap:14px;

padding:18px 36px;

border-radius:999px;

border:
1px solid rgba(212,164,79,0.45);

background:
rgba(212,164,79,0.08);

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

color:#f2d18b;

text-decoration:none;

font-size:11px;

font-weight:600;

letter-spacing:4px;

text-transform:uppercase;

transition:0.5s ease;

position:relative;

overflow:hidden;

box-shadow:
0 0 30px rgba(212,164,79,0.08);

}

.home-button::before{

content:"";

position:absolute;

top:0;
left:-120%;

width:100%;
height:100%;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,0.18),
transparent
);

transition:0.8s ease;

}

.home-button:hover::before{

left:120%;

}

.home-button:hover{

background:
rgba(212,164,79,0.16);

transform:translateY(-4px);

box-shadow:
0 0 40px rgba(212,164,79,0.24);

}

.button-arrow{

font-size:1rem;

display:inline-block;

transition:0.4s ease;

}

.home-button:hover .button-arrow{

transform:translateX(4px);

}

/* =========================
RESPONSIVE
========================= */

@media(max-width:900px){

.error-hero{

padding:240px 8% 120px;

}

.page-text{

font-size:1.08rem;

line-height:2;

}

}

@media(max-width:768px){

.button-group{

flex-direction:column;

gap:18px;

}

.home-button{

width:100%;

max-width:340px;

}

}

@media(max-width:540px){

.page-code{

letter-spacing:4px;

}

.page-title{

font-size:2.4rem;

line-height:1.25;

}

.page-text{

font-size:1rem;

line-height:1.9;

}

.home-button{

font-size:10px;

letter-spacing:3px;

padding:16px 28px;

}

}

</style>

</head>

<body>

<!-- ATMOSPHERE -->

<div class="atmosphere">

<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>

</div>

<!-- UNIVERSAL HEADER -->

<div id="header-container"></div>

<!-- HERO -->

<section class="error-hero">

<div class="hero-overlay"></div>

<div class="error-content">

<div class="page-code">

404

</div>

<h1 class="page-title">

This page vanished into history.

</h1>

<p class="page-text">

Some archives survive centuries.
Some pages disappear along the way.

The page you were searching for may have moved, changed, or quietly faded from the archive.

A Love Older Than Fear still remains open to you.

</p>

<div class="button-group">

<a
href="index.html"
class="home-button">

RETURN HOME

<span class="button-arrow">
➜
</span>

</a>

<a
href="chapters.html"
class="home-button">

EXPLORE CHAPTERS

<span class="button-arrow">
➜
</span>

</a>

</div>

</div>

</section>

<!-- FOOTER -->

<div id="footer-container"></div>

<!-- HEADER LOAD -->

<script>

fetch('header.html')

.then(response => response.text())

.then(data => {

document.getElementById(
'header-container'
).innerHTML = data;

initializeHeader();

})

.catch(error => {

console.error(
'Header failed to load:',
error
);

});

</script>

<!-- FOOTER LOAD -->

<script>

fetch('footer.html')

.then(response => response.text())

.then(data => {

document.getElementById(
'footer-container'
).innerHTML = data;

})

.catch(error => {

console.error(
'Footer failed to load:',
error
);

});

</script>

</body>

</html>
