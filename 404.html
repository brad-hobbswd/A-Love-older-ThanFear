<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Page Not Found | A Love Older Than Fear
</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
rel="stylesheet">

<style>

/* =========================
RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

:root{

--bg-main:#090807;
--bg-alt:#120f0d;

--gold:#d4a44f;
--gold-soft:#f2d18b;

--text:#f8f2e8;
--muted:#c8bbab;

--purple:#41284b;

}

body{

background:var(--bg-main);

font-family:'Inter',sans-serif;

color:var(--text);

overflow-x:hidden;

position:relative;

}

/* =========================
SCROLLBAR
========================= */

::-webkit-scrollbar{
width:10px;
}

::-webkit-scrollbar-track{
background:#090807;
}

::-webkit-scrollbar-thumb{
background:var(--gold);
border-radius:20px;
}

/* =========================
ATMOSPHERE
========================= */

.atmosphere{

position:fixed;

inset:0;

pointer-events:none;

z-index:1;

overflow:hidden;

}

.particle{

position:absolute;

width:3px;
height:3px;

background:rgba(255,215,150,0.18);

border-radius:50%;

animation:float 18s linear infinite;

}

.particle:nth-child(1){
top:10%;
left:15%;
animation-duration:24s;
}

.particle:nth-child(2){
top:70%;
left:80%;
animation-duration:18s;
}

.particle:nth-child(3){
top:40%;
left:55%;
animation-duration:28s;
}

.particle:nth-child(4){
top:80%;
left:30%;
animation-duration:22s;
}

.particle:nth-child(5){
top:20%;
left:90%;
animation-duration:26s;
}

@keyframes float{

0%{
transform:translateY(0);
opacity:0;
}

20%{
opacity:1;
}

80%{
opacity:1;
}

100%{
transform:translateY(-150px);
opacity:0;
}

}

/* =========================
NAVIGATION
========================= */

.floating-nav{

position:fixed;

top:0;
left:0;

width:100%;

padding:22px 4%;

display:flex;

justify-content:space-between;

align-items:center;

z-index:999;

background:
linear-gradient(
180deg,
rgba(0,0,0,0.42),
transparent
);

backdrop-filter:blur(10px);

-webkit-backdrop-filter:blur(10px);

transition:0.5s ease;

}

.nav-logo{

font-family:'Cinzel',serif;

font-size:0.92rem;

letter-spacing:3px;

color:#f2d18b;

white-space:nowrap;

text-decoration:none;

display:block;

text-shadow:
0 0 12px rgba(212,164,79,0.25);

}

.nav-links{

display:flex;

align-items:center;

justify-content:flex-end;

gap:18px;

flex-wrap:wrap;

}

.nav-links a{

text-decoration:none;

font-size:10px;

letter-spacing:2px;

text-transform:uppercase;

color:#d7c3a4;

transition:0.4s ease;

position:relative;

white-space:nowrap;

}

.nav-links a::after{

content:"";

position:absolute;

left:0;
bottom:-6px;

width:0%;
height:1px;

background:#d4a44f;

transition:0.4s ease;

}

.nav-links a:hover{

color:#f2d18b;

text-shadow:
0 0 12px rgba(212,164,79,0.35);

}

.nav-links a:hover::after{

width:100%;

}

/* =========================
404 HERO
========================= */

.error-hero{

position:relative;

min-height:100vh;

display:flex;

align-items:center;
justify-content:center;

padding:
220px 8% 140px;

overflow:hidden;

background:
linear-gradient(
180deg,
#090807 0%,
#120f0d 50%,
#090807 100%
);

}

.error-hero::before{

content:"";

position:absolute;

inset:0;

background:

radial-gradient(
circle at top center,
rgba(212,164,79,0.08),
transparent 45%
),

radial-gradient(
circle at bottom center,
rgba(65,40,75,0.10),
transparent 55%
);

pointer-events:none;

}

.hero-overlay{

position:absolute;

inset:0;

background:
linear-gradient(
180deg,
rgba(0,0,0,0.62) 0%,
rgba(0,0,0,0.12) 40%,
rgba(0,0,0,0.82) 100%
);

z-index:2;

}

.hero-darkness{

position:absolute;

inset:0;

background:
radial-gradient(
circle at center,
transparent 0%,
rgba(0,0,0,0.32) 70%,
rgba(0,0,0,0.78) 100%
);

z-index:2;

}

.error-content{

position:relative;

z-index:5;

max-width:1000px;

margin:auto;

text-align:center;

}

.page-code{

font-family:'Cinzel',serif;

font-size:clamp(7rem,16vw,14rem);

letter-spacing:8px;

color:#d4a44f;

margin-bottom:20px;

text-shadow:
0 0 30px rgba(212,164,79,0.18);

}

.page-title{

font-family:'Cinzel',serif;

font-size:clamp(2.5rem,6vw,5rem);

line-height:1.15;

margin-bottom:35px;

color:#f4e7d2;

}

.page-text{

font-size:1.2rem;

line-height:2;

max-width:780px;

margin:auto auto 55px;

color:#c8bbab;

font-weight:300;

}

.home-button{

display:inline-flex;

align-items:center;
justify-content:center;

padding:18px 42px;

border-radius:60px;

border:
1px solid rgba(212,164,79,0.55);

background:
rgba(212,164,79,0.08);

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

color:#f2d18b;

text-decoration:none;

font-size:12px;

font-weight:600;

letter-spacing:4px;

text-transform:uppercase;

transition:0.5s ease;

box-shadow:
0 0 30px rgba(212,164,79,0.08);

}

.home-button:hover{

background:
rgba(212,164,79,0.18);

transform:translateY(-4px);

box-shadow:
0 0 40px rgba(212,164,79,0.24);

}

/* =========================
FOOTER
========================= */

.site-footer{

position:relative;

padding:120px 8% 70px;

background:
linear-gradient(
180deg,
#090807,
#050404
);

border-top:
1px solid rgba(212,164,79,0.08);

overflow:hidden;

}

.site-footer::before{

content:"";

position:absolute;

inset:0;

background:

radial-gradient(
circle at top center,
rgba(212,164,79,0.06),
transparent 50%
);

pointer-events:none;

}

.footer-content{

position:relative;

z-index:2;

max-width:1200px;

margin:auto;

text-align:center;

}

.footer-title{

font-family:'Cinzel',serif;

font-size:clamp(2rem,4vw,3.5rem);

letter-spacing:2px;

margin-bottom:20px;

color:#f4e7d2;

}

.footer-quote{

font-family:'Cormorant Garamond',serif;

font-size:1.5rem;

line-height:1.7;

color:#d8c7ad;

margin-bottom:35px;

}

.footer-links{

display:flex;

justify-content:center;

flex-wrap:wrap;

gap:24px;

margin-bottom:40px;

}

.footer-links a{

text-decoration:none;

font-size:12px;

letter-spacing:2px;

text-transform:uppercase;

color:#d4a44f;

transition:0.4s ease;

}

.footer-links a:hover{

color:#f2d18b;

text-shadow:
0 0 12px rgba(212,164,79,0.35);

}

.footer-scripture{

font-family:'Cormorant Garamond',serif;

font-size:1.3rem;

line-height:1.8;

color:#c8bbab;

margin-bottom:30px;

}

.footer-copy{

font-size:0.95rem;

letter-spacing:1px;

color:#8f8374;

}

/* =========================
RESPONSIVE
========================= */

@media(max-width:1024px){

.floating-nav{
padding:20px 5%;
}

.nav-links{
gap:20px;
}

.nav-links a{
font-size:10px;
letter-spacing:2px;
}

}

@media(max-width:768px){

.floating-nav{

flex-direction:column;

gap:18px;

padding:18px 5%;

background:
rgba(9,8,7,0.82);

border-bottom:
1px solid rgba(255,255,255,0.04);

}

.nav-logo{

font-size:0.9rem;

letter-spacing:2px;

text-align:center;

}

.nav-links{

justify-content:center;

gap:16px;

}

.nav-links a{

font-size:10px;

letter-spacing:2px;

}

.error-hero{

padding:
240px 8% 120px;

}

.page-text{

font-size:1.05rem;

}

.home-button{

padding:16px 30px;

font-size:11px;

letter-spacing:3px;

}

.site-footer{

padding:100px 8% 60px;

}

}

@media(max-width:540px){

.floating-nav{

padding:16px 20px;

gap:14px;

}

.nav-logo{

font-size:0.75rem;

letter-spacing:1.5px;

line-height:1.5;

}

.nav-links{

gap:12px;

}

.nav-links a{

font-size:9px;

letter-spacing:1.5px;

}

.page-title{

font-size:2.6rem;

line-height:1.25;

}

.page-text{

line-height:1.9;

}

.footer-quote{

font-size:1.2rem;

}

.footer-scripture{

font-size:1.1rem;

}

}

@media(max-width:390px){

.nav-links{

gap:10px;

}

.nav-links a{

font-size:8px;

letter-spacing:1px;

}

}

</style>

</head>

<body>

<!-- ATMOSPHERE -->

<div class="atmosphere">

<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>

</div>

<!-- NAVIGATION -->

<nav class="floating-nav">

<a href="index.html" class="nav-logo">

A LOVE OLDER THAN FEAR

</a>

<div class="nav-links">

<a href="index.html">
Home
</a>

<a href="archive.html">
Archive
</a>

<a href="chapters.html">
Chapters
</a>

<a href="bibliography.html">
Bibliography
</a>

<a href="about.html">
About
</a>

<a href="notes.html">
Notes
</a>

</div>

</nav>

<!-- 404 HERO -->

<section class="error-hero">

<div class="hero-overlay"></div>

<div class="hero-darkness"></div>

<div class="error-content">

<div class="page-code">

404

</div>

<h1 class="page-title">

This page vanished into history.

</h1>

<p class="page-text">

Some archives survive centuries.
Some pages disappear along the way.

The chapter or document you were searching for could not be found.

</p>

<a
href="index.html"
class="home-button">

RETURN TO THE ARCHIVE

</a>

</div>

</section>

<!-- FOOTER -->

<div id="footer-container"></div>

<script>

fetch('footer.html')

.then(response => response.text())

.then(data => {

document.getElementById(
'footer-container'
).innerHTML = data;

})

.catch(error => {

console.error(
'Footer failed to load:',
error
);

});

</script>

<script>

// NAVIGATION FADE

const nav =
document.querySelector(
'.floating-nav'
);

window.addEventListener(
'scroll',
() => {

if(window.innerWidth > 768){

if(window.scrollY > 100){

nav.style.background =
'rgba(9,8,7,0.82)';

nav.style.borderBottom =
'1px solid rgba(255,255,255,0.05)';

}

else{

nav.style.background =
'linear-gradient(180deg, rgba(0,0,0,0.45), transparent)';

nav.style.borderBottom =
'none';

}

}

});

</script>

</body>

</html>
