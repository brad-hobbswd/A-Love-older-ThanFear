<style>

/* =========================
MANUSCRIPT HEADER
========================= */

.site-header{

position:fixed;

top:0;
left:0;

width:100%;

z-index:9999;

padding:22px 5%;

display:flex;

align-items:center;

justify-content:space-between;

background:
rgba(7,6,5,0.78);

backdrop-filter:blur(14px);

-webkit-backdrop-filter:blur(14px);

border-bottom:
1px solid rgba(255,255,255,0.04);

transition:0.45s ease;

}

.site-logo{

font-family:'Cinzel',serif;

font-size:0.95rem;

letter-spacing:3px;

color:#f0cf8d;

text-decoration:none;

white-space:nowrap;

z-index:10001;

}

/* =========================
DESKTOP NAVIGATION
========================= */

.desktop-nav{

display:flex;

align-items:center;

gap:20px;

flex-wrap:wrap;

}

.desktop-nav a{

position:relative;

font-size:10px;

letter-spacing:2px;

text-transform:uppercase;

text-decoration:none;

color:#d7c3a4;

transition:0.4s ease;

}

.desktop-nav a::after{

content:"";

position:absolute;

left:0;
bottom:-7px;

width:0%;

height:1px;

background:#d4a44f;

transition:0.4s ease;

}

.desktop-nav a:hover,
.desktop-nav a.active{

color:#f2d18b;

}

.desktop-nav a:hover::after,
.desktop-nav a.active::after{

width:100%;

}

/* =========================
MOBILE MENU BUTTON
========================= */

.menu-toggle{

display:none;

width:56px;
height:56px;

border-radius:50%;

border:
1px solid rgba(212,164,79,0.3);

background:
rgba(212,164,79,0.06);

align-items:center;

justify-content:center;

cursor:pointer;

z-index:10001;

}

.arrow{

font-size:1.3rem;

color:#f0cf8d;

transition:0.4s ease;

}

.menu-toggle.active .arrow{

transform:rotate(180deg);

}

/* =========================
MENU OVERLAY
========================= */

.menu-overlay{

position:fixed;

inset:0;

background:
rgba(0,0,0,0.55);

backdrop-filter:blur(8px);

opacity:0;

visibility:hidden;

transition:0.45s ease;

z-index:9997;

}

.menu-overlay.active{

opacity:1;

visibility:visible;

}

/* =========================
SLIDE MENU
========================= */

.slide-menu{

position:fixed;

top:0;
right:0;

width:340px;
max-width:90%;

height:100dvh;

background:
linear-gradient(
180deg,
rgba(10,8,7,0.98),
rgba(20,15,13,0.98)
);

padding:120px 40px;

overflow-y:auto;

transform:translateX(110%);

transition:0.5s ease;

z-index:9998;

}

.slide-menu.active{

transform:translateX(0);

}

.slide-links{

display:flex;

flex-direction:column;

gap:24px;

}

.slide-links a{

font-family:'Cinzel',serif;

font-size:1.2rem;

text-decoration:none;

color:#f3e7d4;

display:flex;

justify-content:space-between;

padding-bottom:16px;

border-bottom:
1px solid rgba(255,255,255,0.06);

}

/* =========================
TABLET
========================= */

@media(max-width:1200px){

.site-header{

padding:20px 4%;

}

.desktop-nav{

gap:14px;

}

.desktop-nav a{

font-size:9px;

letter-spacing:1.5px;

}

.site-logo{

font-size:0.82rem;

letter-spacing:2px;

}

}

/* =========================
MOBILE
========================= */

@media(max-width:900px){

.desktop-nav{
display:none;
}

.menu-toggle{
display:flex;
}

.site-header{

padding:18px 5%;

}

.site-logo{

font-size:0.82rem;

letter-spacing:2px;

}

}

/* =========================
DESKTOP ONLY
========================= */

@media(min-width:901px){

.slide-menu,
.menu-overlay{
display:none;
}

}

/* =========================
SMALL MOBILE
========================= */

@media(max-width:540px){

.site-header{

padding:16px 5%;

}

.site-logo{

font-size:0.72rem;

letter-spacing:1.5px;

}

.slide-menu{

padding:110px 28px;

}

.slide-links a{

font-size:1rem;

}

}

</style>

<script>

/* =========================
MOBILE MENU
========================= */

const menuToggle =
document.getElementById(
'menuToggle'
);

const slideMenu =
document.getElementById(
'slideMenu'
);

const menuOverlay =
document.getElementById(
'menuOverlay'
);

menuToggle.addEventListener(
'click',
() => {

menuToggle.classList.toggle(
'active'
);

slideMenu.classList.toggle(
'active'
);

menuOverlay.classList.toggle(
'active'
);

});

menuOverlay.addEventListener(
'click',
() => {

menuToggle.classList.remove(
'active'
);

slideMenu.classList.remove(
'active'
);

menuOverlay.classList.remove(
'active'
);

});

</script>
